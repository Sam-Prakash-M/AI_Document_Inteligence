# Full local stack: app + PostgreSQL/pgvector + Redis (+ optional Ollama).
#
#   cp .env.example .env        # then set APP_API_KEY and your LLM keys
#   docker compose up -d --build
#
# Fully local models (no API keys):  docker compose --profile ollama up -d --build
# (and set the OLLAMA values in .env - see README).

services:
  app:
    build: .
    image: ai-document-intelligence:latest
    ports:
      - "${PORT:-8080}:8080"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/docintel
      DB_USERNAME: docintel
      DB_PASSWORD: ${DB_PASSWORD:-docintel}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: docintel
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docintel}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel -d docintel"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
